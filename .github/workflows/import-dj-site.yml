name: Import DJ site
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import DJ production assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/djcoolradio
          base="https://fifm.ca/djcoolradio"
          for file in splash-background-LOCKED.png brand-header.svg album-button.svg promo.mp4 video-placeholder.webp mix-button.svg gallery31.webp gallery31-popup-480.jpg email-button.svg facebook-button.svg album-art-official-card.jpg mix-art-card.webp; do
            curl --fail --location --retry 3 "$base/$file" --output "public/djcoolradio/$file"
            test -s "public/djcoolradio/$file"
          done
          cat > README.md <<'MD'
          # djcoolradio
          Independent production source for the official Dj Sukhi Singh / djcoolradio website.
          MD
          rm -f .github/workflows/import-dj-site.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import independent DJ production assets"
          git push origin HEAD:main
